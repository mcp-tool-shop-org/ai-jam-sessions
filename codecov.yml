# Patch and project coverage both block. A pull request must cover 90% of
# the lines it changes, and the repository must stay at 90% lines. The
# project status allows a 1% drop before it fails. The comment still carries
# patch coverage and the test results; the repository-wide percentage stays
# out of it.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
        informational: false
    patch:
      default:
        target: 90%
        informational: false

comment:
  layout: "condensed_header, condensed_files, condensed_footer"
  hide_project_coverage: true
  require_changes: false
